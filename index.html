<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inventra — inventory and order management: products, stock, purchase orders, sales orders, customers and reports in one place." />
    <meta name="theme-color" content="#5f45ec" />
    <title>Inventra · Inventory &amp; Order Management</title>
    <script>
      // Apply the saved theme before the first paint so the page never flashes the wrong colours.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('inventra.theme') || '"system"');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          /* storage unavailable: stay on the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
